<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>greenhorn open graph image</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
  background: linear-gradient(180deg, #2E2160 0%, #8A3F86 42%, #FF8A5C 80%, #FFC27A 100%); }
.pier { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: #1A1433; border-top: 10px solid #2D2350; }
.icon { position: absolute; right: 70px; top: 70px; width: 400px; height: 400px; border-radius: 88px; box-shadow: 0 16px 40px rgba(0,0,0,.4); }
.text { position: absolute; left: 80px; top: 120px; width: 640px; }
.kicker { font-size: 26px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: #FFC93C; margin-bottom: 14px; }
h1 { font-size: 132px; line-height: 1; letter-spacing: -.03em; margin-bottom: 26px; }
.tag { font-size: 44px; line-height: 1.18; font-weight: 600; }
.url { position: absolute; left: 80px; bottom: 30px; font-size: 26px; color: #F6ECDD; }
</style>
</head>
<body>
<img class="icon" src="icon.svg" alt="">
<div class="text"><div class="kicker">Claude Code plugin</div><h1>greenhorn</h1><div class="tag">Write it so a greenhorn can follow.</div></div>
<div class="pier"></div>
<div class="url">gagoar.github.io/greenhorn</div>
</body>
</html>
